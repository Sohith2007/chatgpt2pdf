name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Installing puppeteer downloads its own Chrome build, which the smoke
      # test uses to print a real PDF.
      - run: npm ci

      - run: npm test

      - name: Upload rendered output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.node }}
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7
